<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bank Bot</title>

  <style>
    :root{
      --navy:#1a3c6c;
      --navy-2:#2e5a9a;
      --card:#ffffff;
      --bg:#f0f4f8;
      --accent:#5b7cff;
    }

    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      background: var(--bg);
    }

    h1 { text-align:center; }

    .chat-card{
      background:var(--card);
      border-radius:12px;
      box-shadow:0 18px 50px rgba(11,20,40,0.08);
      overflow:hidden;
      margin-bottom:15px;
    }

    .chatbot-header{
      background:linear-gradient(90deg,var(--navy-2),var(--navy));
      color:#fff;
      padding:14px;
      font-weight:700;
      display:flex;
      align-items:center;
      gap:8px;
    }

    .chat-box{
      height:420px;
      overflow-y:auto;
      padding:16px;
      background:linear-gradient(180deg,#fbfdff,#f7fbff);
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .user-msg{
      align-self:flex-end;
      background:linear-gradient(90deg,var(--navy-2),var(--accent));
      color:#fff;
      padding:10px 14px;
      border-radius:12px;
      max-width:75%;
    }

    .bot-msg{
      align-self:flex-start;
      background:#eef3ff;
      color:var(--navy);
      padding:10px 14px;
      border-radius:12px;
      max-width:80%;
    }

    .intent-tag{
      font-size:12px;
      margin-top:6px;
      color:#666;
      font-style:italic;
    }

    .input-group{
      display:flex;
      gap:6px;
      margin-top:10px;
    }

    input{
      flex:1;
      padding:10px;
      border-radius:6px;
      border:1px solid #ccc;
    }

    button{
      padding:10px 16px;
      border:none;
      background:var(--navy);
      color:white;
      border-radius:6px;
      cursor:pointer;
    }

    button:hover{
      background:var(--navy-2);
    }

    a{
      text-decoration:none;
      color:var(--navy);
    }
  </style>
</head>

<body>

<h1>Bank Bot</h1>
<p style="text-align:center">Welcome, {{ username }}! Ask me anything about your bank services.</p>

<div class="chat-card">
  <div class="chatbot-header">
    <img src="{{ url_for('static', filename='bank_zoom.png') }}"
         alt="logo"
         style="height:22px"
         onerror="this.style.display='none'">
    Bank Chatbot
  </div>

  <div class="chat-box" id="chatBox"></div>
</div>

<div class="input-group">
  <input type="text" id="userInput" placeholder="Type your message..." autocomplete="off">
  <button onclick="sendMessage()">Send</button>
</div>

<p style="text-align:center; margin-top:10px">
  <a href="{{ url_for('dashboard') }}">⬅ Back to Dashboard</a>
</p>

<script>
  function sendMessage() {
    const input = document.getElementById("userInput");
    const message = input.value.trim();
    if (!message) return;

    const chatBox = document.getElementById("chatBox");

    // user message
    chatBox.innerHTML += `
      <div class="user-msg">${escapeHtml(message)}</div>
    `;
    chatBox.scrollTop = chatBox.scrollHeight;
    input.value = "";

    fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: message })
    })
    .then(res => res.json())
    .then(data => {
      chatBox.innerHTML += `
        <div class="bot-msg">
          ${escapeHtml(data.reply)}
          <div class="intent-tag">Intent: ${escapeHtml(data.intent)}</div>
        </div>
      `;
      chatBox.scrollTop = chatBox.scrollHeight;
    });
  }

  function escapeHtml(text) {
    const map = {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    };
    return text.replace(/[&<>"']/g, m => map[m]);
  }

  document.getElementById("userInput").addEventListener("keypress", function(e){
    if (e.key === "Enter") sendMessage();
  });
</script>

</body>stream
</html>
